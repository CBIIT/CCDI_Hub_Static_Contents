# Data Usage Policies page content
# id is not editable
# topic and content are editable
dataUsagePoliciesIntroText: <p>There are policies and terms to keep in mind when using and connecting with Childhood Cancer Data Initiative (CCDI)-managed data and tools through the CCDI Hub.</p><p className="calloutBox">If you’re looking for information on how to find, request, access, download, and analyze controlled-access data managed by CCDI, see our <a class="link" href="https://datacatalog.ccdi.cancer.gov/CCDI_CGC_Data_Access_Instructions_2.0.pdf" target="_blank" rel="noopener noreferrer">data access instructions guide.</a></p>
dataUsagePoliciesContent:
  - id: Data_Use_Expectations
    topic: Data Use Expectations
    content: >-
      <p>The CCDI Hub allows the public to view and analyze cancer data based on the NIH/NCI Data Use Agreements specific to individual data sets. Users agree not to use CCDI data, either alone or with any other information, to identify or contact individual participants from whom data and/or samples were collected. Additionally, users must protect all CCDI data from being inadvertently made identifiable through reverse-engineering algorithms or analytical reidentification techniques.</p>

  - id: Data_Disclaimers
    topic: Data Disclaimers
    content: >-
      <p>Data are exceedingly valuable for our improved understanding of cancer and are the foundation for the discovery of many novel targets or biomarker signatures. When interpreting the data and/or using the information in follow-up experiments, it is the user’s responsibility to determine whether the initial design is suitable for their downstream goals, understand the bases of any errors, and apply appropriate filters.</p>

  - id: CCDI_Acknowledgement
    topic: CCDI Acknowledgement
    content: >- 
      <p>NCI recommends users follow standard scientific etiquette and practices when working with CCDI-managed data or publishing results generated using the data.</p>
      <ul><li>Acknowledge in all oral or written presentations, disclosures, or publications the specific data set(s) or applicable Digital Object Identifiers, and the data repositories through which the investigator accessed the data. Citation guidelines for doing this are outlined below.</li>
      <li>Notify us at <a href="mailto:ncichildhoodcancerdatainitiative@mail.nih.gov" target="_blank" rel="noopener noreferrer">ncichildhoodcancerdatainitiative@mail.nih.gov</a> if you have utilized CCDI-managed data in your research, so we can include your work on our web pages.</li>
      <li>Properly reference original research paper(s) if the data being used corresponds to a manuscript(s) resulting from CCDI-supported efforts.</li></ul>

  - id: Citing_the_CCDI_Hub
    topic: Citing the CCDI Hub
    content: >-
      <p>NCI expects users to acknowledge CCDI data use as follows:</p>
      <p><q>The results published here are, in whole or in part, derived from the analysis of data listed in the CCDI Hub (<a href="/">ccdi.cancer.gov</a>), established by the National Cancer Institute’s Childhood Cancer Data Initiative (CCDI).</q></p>
      <p>To cite individual studies, note the CCDI study ID (e.g., phs002790) and include the name and URL or link for the CCDI Hub (<a href="/">ccdi.cancer.gov</a>), along with the phrase, <q>established by the National Cancer Institute’s Childhood Cancer Data Initiative (CCDI).</q></p>
      <p>Example: <q>The results analyzed and &lt;published or shown&gt; here are based in whole or in part from analyzing the Molecular Characterization Initiative data listed in the CCDI Hub (<a href="/">ccdi.cancer.gov</a>) under study ID phs002790. The data were accessed from the NCI’s Cancer Research Data Commons (<a href="https://datacommons.cancer.gov/" target="_blank" rel="noopener noreferrer">datacommons.cancer.gov</a>). The CCDI Hub was established by the National Cancer Institute’s Childhood Cancer Data Initiative (CCDI).</q></p>

  - id: Contact_Policies
    topic: Contact
    content: >-
      <p>For any questions or concerns related to CCDI-managed data, email CCDI at <a href="mailto:ncichildhoodcancerdatainitiative@mail.nih.gov" target="_blank" rel="noopener noreferrer">ncichildhoodcancerdatainitiative@mail.nih.gov</a>.</p>
      <p className="calloutBox">For information on sharing NCI-funded cancer research data, <a href="https://datascience.cancer.gov/data-sharing/policy-guidance" target="_blank" rel="noopener noreferrer">NCI‘s official data sharing policy guidance</a> details the people, policies, requirements, and resources you need to start sharing your data.</p>
