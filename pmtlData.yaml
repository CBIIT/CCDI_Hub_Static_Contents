introText: >-
  <p>The development of safe and effective therapies for children with cancer requires early and intentional planning in drug development. Federal policies, Best Pharmaceuticals for Children Act (BPCA) and the Pediatric Research Equity Act (PREA), support the evaluation of oncology products in pediatric populations. As part of this effort, the Pediatric Molecular Target Lists (PMTL) was developed by the Food and Drug Administration (FDA), with input from the National Cancer Institute and the pediatric cancer research community, to identify molecular targets relevant to pediatric cancers.</p>
pmtlContent: 
  - id: FDA_PMTL_Lists
    topic: FDA PMTL Lists
    list:
      - id: FDA_PMTL_Lists_Introduction
        content: >-
          <p>The Pediatric Molecular Target Lists (PMTL) include two categories:</p>
          <ol>
            <li><a class="link" href="https://www.fda.gov/media/161463/download?attachment" target="_blank" rel="noopener noreferrer">Relevant Molecular Targets</a> – Targets with scientific evidence (such as gene expression data, genetic alterations, or published research) suggesting they may play a role in the growth or progression of pediatric cancers.</li>
            <li><a class="link" href="https://www.fda.gov/media/161462/download?attachment" target="_blank" rel="noopener noreferrer">Non-Relevant Molecular Targets (Leading to Waiver)</a> – Targets with evidence indicating they are not associated with pediatric tumor growth and may therefore qualify for waiver of early pediatric assessment.</li>
          </ol>
          <p>These lists are updated regularly as new scientific data becomes available and are posted on the <a class="link" href="https://www.fda.gov/about-fda/oncology-center-excellence/pediatric-oncology" target="_blank" rel="noopener noreferrer">FDA Oncology Center of Excellence website</a>. They fulfill statutory requirements under <a class="link" href="https://www.fda.gov/regulatory-information/search-fda-guidance-documents/fdara-implementation-guidance-pediatric-studies-molecularly-targeted-oncology-drugs-amendments-sec" target="_blank" rel="noopener noreferrer">FDARA</a> and help guide industry in planning initial Pediatric Study Plans for oncology drugs and biologics in development, consistent with PREA.</p>
  - id: Contact
    topic: Contact
    list:
      - id: Contact_Information_PMTL
        content: >-
          <p>For questions related to the FDA Pediatric Molecular Target Lists, please contact <a href="mailto:OCEPeRC@fda.hhs.gov">OCEPeRC@fda.hhs.gov</a>. For all other inquiries, please contact the <a href="mailto:NCIChildhoodCancerDataInitiative@mail.nih.gov">CCDI mailbox</a>.</p>
