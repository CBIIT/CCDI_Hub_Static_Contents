# id is not editable
# topic and content are editable
cpiIntroText: <p>The Childhood Cancer Data Initiative (CCDI) Participant Index (CPI) maps research participant identifiers across multiple studies and institutions, collectively referred to as “Domains”. By mappings these identifiers, CPI enables researchers to connect data associated with the same individual across different datasets stored in sources such as the CCDI Hub and National Childhood Cancer Registry (NCCR). This mapping capability enhances the discovery of multimodal data, facilitating the exploration of complex research questions, and ultimately supporting the development of innovative therapies for pediatric cancers.</p>
cpiContent: 
  - id: CPI_Components
    topic: Components
    content: >- 
      <p>“Identifiers” and “Domains” make up the structure of the CPI. These elements are essential for organizing and mapping participant data across various studies and organizations. The key components include:</p>
      <ul><li><b>Identifier</b>: A public identifier (Participant ID) appearing in a research dataset accessible to researchers (e.g., Kids First ID, GENIE ID).</li>
      <li><b>Domain</b>: Groups of unique participant IDs categorized as follows:<ul><li><b>Organizational Identifier</b>: A project/network of unique participant identifiers (e.g. Children's Oncology Group, AACR GENIE, Pediatric Cancer Data Commons).</li>
      <li><b>Data Set</b>: A single dataset for a particular study where data files for the participants can be found (e.g., dbGaP accession numbers).</li>
      <li><b>Study</b>: Programmatic references to research initiatives (e.g., TARGET, Gabriella Miller Kids First).</li></ul></li></ul>
      <p>Further information on CPI components and functions can be found at <a href="https://participantindex-docs.ccdi.cancer.gov" target="_blank" rel="noopener noreferrer">participantindex-docs.ccdi.cancer.gov</a>.</p>
  - id: Core_Functions_of_the_CPI
    topic: Core Functions of the CPI
    content: >-
     <p>The CPI API functions as a reference service that allows software applications to communicate with each other, providing information on participants’ research IDs to authorized applications. Integration with the CPI is currently under development for applications like the CCDI Hub and Federation Data Resource.<p>
     <p>The CPI addresses key questions such as:</p>
     <ul><li><b>Which participants and domains are associated with mine?</b> Authorized applications can input participant ID(s) and retrieve all associated IDs along with their respective domains. This helps in mapping participants across different data sets and studies.</li>
     <li><b>What are the current domains in the CPI and their participant statistics?</b> Authorized users can access comprehensive information about each domain within the CPI database. This includes the domain name, description, category, and a URL linking to additional data, offering context about where a participant’s data is present. Also available are participant statistics for each domain, including the number of participants mapped to various domains, along with the total counts of participants.</li></ul>
  - id: CPI_Request_Access
    topic: Request Access
    content: >- 
     <p>The CPI API will be made available to applications and services authorized by NCI. Interested system owners may initiate a request for access by emailing <a href="mailto:NCIChildhoodCancerDataInitiative@mail.nih.gov" target="_blank" rel="noopener noreferrer">NCIChildhoodCancerDataInitiative@mail.nih.gov</a>.</p>
  - id: Contribute_to_the_CPI
    topic: Contribute to the CPI
    content: >- 
      <p>We invite the community to join us in empowering childhood cancer research. By contributing to the CPI, you can help expand the scope and depth of participant information available to researchers, which could facilitate more comprehensive studies and potentially leading to groundbreaking discoveries. To contribute:</p>
      <ol><li><b>Submit a Contribution Request</b>: Contact the <a href="mailto:NCIChildhoodCancerDataInitiative@mail.nih.gov" target="_blank" rel="noopener noreferrer">CPI Support Team</a> to express your interest.</li>
      <li><b>Data Preparation</b>: Once a request is received, the CPI Support Team will provide the CPI Submission Template for participant ID and domain categorization.</li>
      <li><b>Data Submission</b>: Follow the provided instructions to submit your data to the CPI.</li></ol>
  - id: CPI_Contact
    topic: Contact
    content: >- 
      <p>For more information or to request access to the CPI API, please contact the CPI support team at <a href="mailto:NCIChildhoodCancerDataInitiative@mail.nih.gov" target="_blank" rel="noopener noreferrer">NCIChildhoodCancerDataInitiative@mail.nih.gov</a>.</p>

cbioportalIntroText: >-
  <p>To make complex genomic data more accessible, the Childhood Cancer Data Initiative (CCDI) is launching a user-friendly instance of cBioPortal that allows users—regardless of computational expertise—to explore and analyze without needing to download or process large datasets.</p>
  <p>cBioPortal is an open-source, web-based platform designed to explore cancer data from large studies. Users can search by gene, mutation, cancer type, or patient and quickly visualize relationships, patterns, and trends in the data. CCDI’s customized instance “CCDI cBioPortal Cancer Data Explorer” is tailored to support pediatric cancer researchers and clinicians by enabling them to:</p>
  <ul><li>Access standardized genomic and clinical data</li><li>Explore findings without the need to download or process large datasets</li><li>Facilitate collaborative and translational research by bridging basic science and clinical insights</li></ul>
  <p>The pilot version of CCDI cBioPortal Cancer Data Explorer includes mutation data extracted from the genomic variant files of the <a href="/MCI">Molecular Characterization Initiative</a> (MCI). Over time, additional data will be added from the growing collection available in the <a href="/explore">CCDI Data Hub</a>.</p>
  <div><a class="cBioPortalButton" href="https://cbioportal.ccdi.cancer.gov" target="_blank" rel="noopener noreferrer">GO TO CCDI CBIOPORTAL</a></div>

cbioportalContent:
  - id: cbioportal_Contact
    topic: Contact 
    content: >-
      <p>For more information, email us at <a href="mailto:NCIChildhoodCancerDataInitiative@mail.nih.gov" target="_blank" rel="noopener noreferrer">NCIChildhoodCancerDataInitiative@mail.nih.gov</a>.</p>

toolsIntroText:
toolsContent:
  - id: CCDI Data Model 
    topic: CCDI Data Model 
    content: >-
      <p>The Childhood Cancer Data Initiative (CCDI) Data Model is a structured framework developed to standardize and harmonize pediatric cancer data across diverse research platforms. It defines key entities—such as participants, diagnoses, biospecimens, and treatments—and their relationships to ensure consistent data representation. The model plays a central role in enabling data integration, sharing, and analysis within the CCDI Data Ecosystem. To interactively view the data model, please click <a href="/data-model">here</a>.</p>
      <p>Link: <a class="link" href="https://github.com/CBIIT/ccdi-model" target="_blank" rel="noopener noreferrer">https://github.com/CBIIT/ccdi-model</a></p>
      <p>Contact: <a href="mailto:NCIChildhoodCancerDataInitiative@mail.nih.gov" target="_blank" rel="noopener noreferrer">NCIChildhoodCancerDataInitiative@mail.nih.gov</a></p>
  - id: C3DC Data Model
    topic: C3DC Data Model
    content: >-
      <p>The Childhood Cancer Clinical Data Commons (C3DC) Data Model is a structured framework designed to standardize and harmonize pediatric cancer clinical data across diverse studies and platforms. It defines key entities—such as participants, diagnoses, biospecimens, and treatments—and their interrelationships to ensure consistent and interoperable data representation. By supporting the harmonization of data from multiple sources, the model enables researchers to work with integrated datasets, promoting efficient data sharing, analysis, and collaboration.</p>
      <p>Link: <a class="link" href="https://github.com/CBIIT/c3dc-model" target="_blank" rel="noopener noreferrer">https://github.com/CBIIT/c3dc-model</a></p>
      <p>Contact: <a href="mailto:NCIChildhoodCancerDataInitiative@mail.nih.gov" target="_blank" rel="noopener noreferrer">NCIChildhoodCancerDataInitiative@mail.nih.gov</a></p>
  - id: Cancer Genomics Cloud
    topic: Cancer Genomics Cloud
    content: >-
      <p>The NCI’s Cancer Genomics Cloud (CGC), powered by Velsera, is a cloud-based platform that enables analysis, storage, and computation of large cancer datasets. The CGC provides a user-friendly portal to access and analyze more than 3 petabytes of data. It offers over 900 bioinformatics tools and workflows, allowing users—including those without programming experience—to perform complex analyses and collaborate with a global community of over 8,000 researchers.</p>
      <p>Link: <a class="link" href="https://www.cancergenomicscloud.org/" target="_blank" rel="noopener noreferrer">https://www.cancergenomicscloud.org/</a></p>
      <p>Contact: <a href="mailto:cgc-sb@velsera.com" target="_blank" rel="noopener noreferrer">cgc-sb@velsera.com</a></p>
  - id: dbGaP
    topic: dbGaP
    content: >-
      <p>dbGaP (Database of Genotypes and Phenotypes) is a resource developed by the National Center for Biotechnology Information (NCBI) to store and distribute data from studies exploring the relationship between genetic variation (genotypes) and observable traits in humans (phenotypes). It houses genomic, imaging, clinical, and other types of individual-level data. To protect participant privacy, access to controlled-access data requires researchers to submit a <a class="link" href="https://sharing.nih.gov/accessing-data/accessing-genomic-data/how-to-request-and-access-datasets-from-dbgap" target="_blank" rel="noopener noreferrer">data access request</a>.</p>
      <p>Link: <a class="link" href="https://www.ncbi.nlm.nih.gov/gap/" target="_blank" rel="noopener noreferrer">https://www.ncbi.nlm.nih.gov/gap/</a></p>
      <p>Contact: <a href="mailto:dbgap-help@ncbi.nlm.nih.gov" target="_blank" rel="noopener noreferrer">dbgap-help@ncbi.nlm.nih.gov</a></p>
  - id: GWAS Explorer
    topic: GWAS Explorer
    content: >-
      <p>GWAS Explorer allows genetics researchers to search, visualize, and download aggregated association results from genome-wide association studies (GWAS). It provides association summary statistics for over 200 cancer and cancer-related phenotypes, harmonized from large-scale GWAS efforts. Interactive tools are available to visualize and examine association results utilizing dynamic Manhattan and Miami plots, stratify data by sex and ancestry, and review diagnostic plots (e.g., Q-q plots).</p>
      <p>Link: <a class="link" href="https://exploregwas.cancer.gov/#/" target="_blank" rel="noopener noreferrer">https://exploregwas.cancer.gov/#/</a></p>
      <p>Contact: <a href="mailto:NCIExploreGWASWebAdmin@mail.nih.gov" target="_blank" rel="noopener noreferrer">NCIExploreGWASWebAdmin@mail.nih.gov</a></p>
  - id: MCI_JSON2TSV
    topic: MCI_JSON2TSV
    content: >-
      <p>The MCI_JSON2TSV script is a Python-based command-line interface developed by the NCI’s Childhood Cancer Data Initiative (CCDI). Its primary function is to convert Molecular Characterization Initiative’s de-identified clinical report and clinical data files submitted in JSON format into tab-separated values (TSV) files. It can generate a single TSV that combines all case report form types, or, if preferred, create separate TSVs by form type or parsed variant results, making it easier to analyze, share, and integrate data with downstream systems.</p>
      <p>Link: <a class="link" href="https://github.com/CBIIT/ChildhoodCancerDataInitiative-MCI_JSON2TSV" target="_blank" rel="noopener noreferrer">https://github.com/CBIIT/ChildhoodCancerDataInitiative-MCI_JSON2TSV</a></p>
      <p>Contact: <a href="mailto:NCIChildhoodCancerDataInitiative@mail.nih.gov" target="_blank" rel="noopener noreferrer">NCIChildhoodCancerDataInitiative@mail.nih.gov</a></p>
  - id: RanBALL
    topic: RanBALL
    content: >-
      <p>RanBALL is an ensemble machine learning model that uses random projection and support vector machines to accurately and cost-effectively identify B-cell acute lymphoblastic leukemia (B-ALL) subtypes using only transcriptomic profiling data. This tool improved clinical diagnosis, risk stratification, and personalized treatment for B-ALL patients through effective classification and visualization.</p>
      <p>Link: <a class="link" href="https://github.com/wan-mlab/RanBALL" target="_blank" rel="noopener noreferrer">https://github.com/wan-mlab/RanBALL</a></p>
      <p>Contact: <a href="mailto:lli@unmc.edu" target="_blank" rel="noopener noreferrer">lli@unmc.edu</a></p>
  - id: AttentionAML
    topic: AttentionAML
    content: >-
      <p>AttentionAML is a novel deep learning framework that uses an attention-based multilayer perceptron (MLP) model to accurately identify acute myeloid leukemia (AML) subtypes from transcriptomic data alone. A user-friendly Python package is available to help researchers implement the model. It enables precise classification and clustering of AML subtypes, and facilitates improved risk stratification and personalized treatment planning.</p>
      <p>Link: <a class="link" href="https://github.com/wan-mlab/AttentionAML" target="_blank" rel="noopener noreferrer">https://github.com/wan-mlab/AttentionAML</a></p>
      <p>Contact: <a href="mailto:swan@unmc.edu" target="_blank" rel="noopener noreferrer">swan@unmc.edu</a></p>
  - id: EwS-Pacbio
    topic: EwS-Pacbio
    content: >-
      <p>The EwS-Pacbio repository provides tools for analyzing long-read targeted sequencing FASTQ files to investigate microsatellites and germline variants associated with Ewing sarcoma (EwS) susceptibility. Leveraging PacBio sequencing technology, the resource enables high-resolution investigation of genetic risk factors, including variant analysis and microsatellite profiling. It includes workflows and visualizations fused in associated publications, supporting deeper insights into EwS-related genetic mechanisms.</p>
      <p>Link 1: Code for 6p25.1 microsatellite and germline variant analysis is available at: <a class="link" href="https://github.com/machiela-lab/EwS-Pacbio" target="_blank" rel="noopener noreferrer">https://github.com/machiela-lab/EwS-Pacbio</a></p>
      <p>Link 2: Code for gene expression analysis is available at: <a class="link" href="https://github.com/calvin-s-rodrigues/EwS_6p25.1_RREB1" target="_blank" rel="noopener noreferrer">https://github.com/calvin-s-rodrigues/EwS_6p25.1_RREB1</a></p>
      <p>Contact: <a href="mailto:mitchell.machiela@nih.gov" target="_blank" rel="noopener noreferrer">mitchell.machiela@nih.gov</a></p>
