name: Auto-Merge After Frontend Deployment

on:
  repository_dispatch:
    types: [frontend-deployment-success]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: Auto-Merge Branches
    runs-on: ubuntu-latest

    steps:
      - name: Validate Deployment Environment
        id: validate
        run: |
          DEPLOYED_ENV="${{ github.event.client_payload.environment }}"
          echo "Deployed environment: ${DEPLOYED_ENV}"

          if [[ "${DEPLOYED_ENV}" == "qa" ]]; then
            echo "source_branch=qa" >> $GITHUB_OUTPUT
            echo "target_branch=stage" >> $GITHUB_OUTPUT
            echo "merge_message=Auto-merge QA to stage after successful QA frontend deployment" >> $GITHUB_OUTPUT
          elif [[ "${DEPLOYED_ENV}" == "stage" ]]; then
            echo "source_branch=stage" >> $GITHUB_OUTPUT
            echo "target_branch=prod" >> $GITHUB_OUTPUT
            echo "merge_message=Auto-merge stage to prod after successful stage frontend deployment" >> $GITHUB_OUTPUT
          else
            echo "::error::Invalid environment '${DEPLOYED_ENV}'. Expected 'qa' or 'stage'."
            exit 1
          fi

          echo "Will merge ${DEPLOYED_ENV} -> $(echo $GITHUB_OUTPUT | grep target_branch | cut -d'=' -f2)"

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch All Branches
        run: |
          git fetch origin ${{ steps.validate.outputs.source_branch }}
          git fetch origin ${{ steps.validate.outputs.target_branch }}

      - name: Perform Merge
        id: merge
        run: |
          SOURCE_BRANCH="${{ steps.validate.outputs.source_branch }}"
          TARGET_BRANCH="${{ steps.validate.outputs.target_branch }}"
          MERGE_MESSAGE="${{ steps.validate.outputs.merge_message }}"

          echo "============================================="
          echo "Merging ${SOURCE_BRANCH} -> ${TARGET_BRANCH}"
          echo "============================================="

          # Checkout target branch
          git checkout "${TARGET_BRANCH}"

          # Get current commit before merge
          BEFORE_COMMIT=$(git rev-parse HEAD)
          echo "Target branch ${TARGET_BRANCH} currently at: ${BEFORE_COMMIT}"

          # Get source branch commit
          SOURCE_COMMIT=$(git rev-parse "origin/${SOURCE_BRANCH}")
          echo "Source branch ${SOURCE_BRANCH} at: ${SOURCE_COMMIT}"

          # Check if merge is needed
          if git merge-base --is-ancestor "origin/${SOURCE_BRANCH}" HEAD; then
            echo "::notice::No merge needed - ${TARGET_BRANCH} already contains all changes from ${SOURCE_BRANCH}"
            echo "merge_performed=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Perform the merge
          echo "Performing merge..."
          if git merge "origin/${SOURCE_BRANCH}" --no-ff -m "${MERGE_MESSAGE}

          Triggered by: Jenkins Frontend Deployment
          Source: ${SOURCE_BRANCH} (${SOURCE_COMMIT})
          Target: ${TARGET_BRANCH}
          Jenkins Build: ${{ github.event.client_payload.build_url }}

          Auto-generated by GitHub Actions"; then
            echo "merge_performed=true" >> $GITHUB_OUTPUT
            AFTER_COMMIT=$(git rev-parse HEAD)
            echo "after_commit=${AFTER_COMMIT}" >> $GITHUB_OUTPUT
            echo "Merge successful! New commit: ${AFTER_COMMIT}"
          else
            echo "::error::Merge failed - conflicts detected"
            echo "merge_performed=false" >> $GITHUB_OUTPUT
            echo "merge_failed=true" >> $GITHUB_OUTPUT

            # Abort the merge
            git merge --abort

            # Create an issue or PR for manual resolution
            echo "Creating notification for manual resolution..."
            exit 1
          fi

      - name: Push Changes
        if: steps.merge.outputs.merge_performed == 'true'
        run: |
          TARGET_BRANCH="${{ steps.validate.outputs.target_branch }}"
          echo "Pushing changes to ${TARGET_BRANCH}..."
          git push origin "${TARGET_BRANCH}"
          echo "Push successful!"

      - name: Create Issue on Merge Failure
        if: failure() && steps.merge.outputs.merge_failed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const sourceBranch = '${{ steps.validate.outputs.source_branch }}';
            const targetBranch = '${{ steps.validate.outputs.target_branch }}';
            const buildUrl = '${{ github.event.client_payload.build_url }}' || 'N/A';

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Merge conflict: ${sourceBranch} -> ${targetBranch}`,
              body: `## Auto-Merge Failed

            The automatic merge from \`${sourceBranch}\` to \`${targetBranch}\` failed due to merge conflicts.

            ### Details
            - **Source Branch:** ${sourceBranch}
            - **Target Branch:** ${targetBranch}
            - **Jenkins Build:** ${buildUrl}
            - **Workflow Run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}

            ### Action Required
            Please manually resolve the conflicts and merge the branches:

            \`\`\`bash
            git checkout ${targetBranch}
            git pull origin ${targetBranch}
            git merge origin/${sourceBranch}
            # Resolve conflicts
            git add .
            git commit -m "Resolve merge conflicts: ${sourceBranch} -> ${targetBranch}"
            git push origin ${targetBranch}
            \`\`\`

            /cc @CBIIT/ccdi-hub-team`,
              labels: ['merge-conflict', 'auto-merge', 'needs-attention']
            });

      - name: Summary
        if: always()
        run: |
          echo "============================================="
          echo "Auto-Merge Summary"
          echo "============================================="
          echo "Environment Deployed: ${{ github.event.client_payload.environment }}"
          echo "Source Branch: ${{ steps.validate.outputs.source_branch }}"
          echo "Target Branch: ${{ steps.validate.outputs.target_branch }}"
          echo "Merge Performed: ${{ steps.merge.outputs.merge_performed || 'N/A' }}"
          echo "Jenkins Build: ${{ github.event.client_payload.build_url }}"
          echo "============================================="
