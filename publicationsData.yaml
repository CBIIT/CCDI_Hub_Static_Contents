  - id: NCCR_05072025_1
    title: >-
      Exploring the National Childhood Cancer Registry (NCCR) Data Platform for Advancing Cancer Research 
    link: https://onlinelibrary.wiley.com/doi/full/10.1002/pbc.31765?campaign=woletoc
    date: May 2025
    summary: >-
      <p>Childhood, adolescent and young adult (AYA) cancers are rare and data reuse is critically important to drive discovery. However, research, clinical and administrative data are fragmented across multiple institutions and largely inaccessible for broader reuse. The National Childhood Cancer Registry (NCCR), a key component of the Childhood Cancer Data Initiative (CCDI), integrates rich and diverse data from cancer registries and multiple real-world sources under a unified governance framework. The newly launched NCCR Data Platform makes these data accessible to childhood and AYA cancer researchers for a wide range of research questions.</p>  
