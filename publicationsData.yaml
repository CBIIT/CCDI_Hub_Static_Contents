  - id: Ecosystem_11142025
    title: >-
       The impact of focused federal initiatives on pediatric cancer research
    link: https://doi.org/10.1002/cncr.70172
    date: November 2025
    summary: >-
      <p>Research progress in recent decades has led to improved outcomes for children, adolescents, and young adults (AYAs) with cancer, but cancer remains the leading cause of disease-related death in children in the United States. Moreover, more than 30% of successfully treated children experience potentially debilitating and life-threatening late effects of treatment,affecting quality of life. The lower incidence of cancers in children when compared with cancers in adults poses significant challenges to the design and conduct of clinical trials. Historically, pediatric cancer research has faced challenges such as limited market incentives for pharmaceutical development, low industry engagement, and insufficient data-sharing infrastructure, hindering the development of new therapies.</p>  
    category: Primary
    tag: CCDI Ecosystem
    journal: >-
      Cancer
    pmid: 41237091
  
  - id: Ecosystem_09022025
    title: >-
       The Open Pediatric Cancer Project
    link: https://doi.org/10.1093/gigascience/giaf093
    date: September 2025
    summary: >-
      <p>In 2019, the Open Pediatric Brain Tumor Atlas (OpenPBTA) was created as a global, collaborative open-science initiative to genomically characterize 1,074 pediatric brain tumors and 22 patient-derived cell lines. Here, we present an extension of the OpenPBTA called the Open Pediatric Cancer (OpenPedCan) Project, a harmonized open-source multiomic dataset from 6,112 pediatric cancer patients with 7,096 tumor events across more than 100 histologies. Combined with RNA sequencing (RNA-seq) from the Genotype-Tissue Expression and The Cancer Genome Atlas projects, OpenPedCan contains nearly 48,000 total biospecimens (24,002 tumor and 23,893 normal specimens).</p>  
    category: Primary
    tag: CCDI Ecosystem
    journal: >-
      GigaScience
    pmid: 40891528
    
  - id: MCICOG_08062025
    title: >-
      Childhood Cancer Data Initiative: Expanded access to tumor molecular profiling for children, adolescents, and young adults 
    link: https://doi.org/10.1093/jnci/djaf214
    date: August 2025
    summary: >-
      <p>The Molecular Characterization Initiative (MCI), a key effort of the NCI’s Childhood Cancer Data Initiative (CCDI), was launched in 2022 in collaboration with the Children’s Oncology Group (COG) to bring comprehensive genomic and molecular profiling to children, adolescents and young adults diagnosed with cancer. The MCI provides paired tumor and germline molecular testing, with results returned to clinicians to inform care. De-identified data are made available to the research community through the CCDI Data Ecosystem to facilitate the discovery of new treatment strategies. This commentary outlines the MCI’s development, key accomplishments to date, and its role in laying the foundation for standardized clinical diagnostics in pediatric oncology.</p>  
    category: Primary
    tag: CCDI-MCI
    journal: >-
      JNCI: Journal of the National Cancer Institute
    pmid: 40794906

  - id: Ecosystem_08012025_1
    title: >-
      Cancer survivorship for the PCP 
    link: https://doi.org/10.1016/j.cppeds.2025.101823
    date: August 2025
    summary: >-
      <p>The number of childhood cancer survivors (CCS) in the United States exceeds 500,000 and continues to rise. While recurrence risk diminishes over time, the prevalence of late effects from cancer treatment increases with age and affects over 60% of survivors. Primary care providers (PCPs) are ideally positioned to manage the long-term health needs of CCS, yet many feel ill-equipped due to a lack of concise guidelines. This article provides a comprehensive overview for PCPs on managing late effects in CCS. Key areas of focus include general health maintenance, psychological and neurocognitive care, immune function and vaccinations, as well as monitoring for endocrine, cardiovascular, pulmonary, and secondary malignancies. Emphasis is placed on regular screenings and lifestyle modifications. We advocate for proactive PCP involvement in the surveillance and management of late effects associated with childhood cancer treatment.</p>  
    category: Secondary
    tag: CCDI Ecosystem
    journal: >-
      Current Problems in Pediatric and Adolescent Health Care
    pmid: 40992854

  - id: Ecosystem_08012025_2
    title: >-
      Foreword: Issue 2 the primary care providers role: From vascular tumors/malformations to cancer, both survivorship and end of life care
    link: https://doi.org/10.1016/j.cppeds.2025.101825
    date: August 2025
    summary: >-
      <p>This continues our second installment on articles for CPPAH devoted to hematological disorders and concentrates on vascular tumors and cancer care in the pediatric population. These articles highlight the difficult conversations when initially presented with these challenging diagnoses and longitudinal care that follows. Where our first three articles in the last edition focused on the cellular aspect of the hematological system and diagnosis these three issues deal mostly with after the diagnosis of an oncological disorder and the aftermath. The authors share extremely helpful insights that will definitely change the way you communicate and practice the next time you are part of a pediatric patient’s cancer diagnosis.</p>  
    category: Secondary
    tag: CCDI Ecosystem
    journal: >-
      Current Problems in Pediatric and Adolescent Health Care
    pmid: 40992852

  - id: Ecosystem_07272025
    title: >-
      Impact of Physics Modeling on Monte Carlo Normal Tissue Dose Reconstructions for Passive Scattering Proton Therapy Patients
    link: https://aapm.confex.com/aapm/2025am/meetingapp.cgi/Paper/19061
    date: July 2025
    summary: >-
      <p>The National Cancer Institute’s Pediatric Proton and Photon Therapy Comparison Cohort aims to collect and analyze data from cancer centers across the United States and Canada to quantify differences in the risk of developing second malignancies among patients treated with proton versus photon radiotherapy. In this cohort, Monte Carlo (MC) simulations will be used to retroactively calculate dose estimates for passive scattering proton therapy patients. However, such high-energy simulations rely on physics models to estimate interaction probabilities, acting as a source of dose uncertainty. The purpose of this study is to investigate the impact of physics model selection on normal tissue dose reconstruction</p>  
    category: Abstracts
    tag: CCDI Ecosystem
    conference: AAPM (American Association of Physicists in Medicine) 2025 Annual Meeting & Exhibition
    
  - id: NCCR_06142025
