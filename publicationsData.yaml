  - id: Ecosystem_04282025
    title: >-
      Automated Classification of Pediatric Sarcoma Using Digital Histopathy
    link: https://www.abstractsonline.com/pp8/#!/20273/presentation/3252
    date: April 2025
    summary: >-
      <p>Pediatric sarcomas are challenging to accurately classify due to their rarity and the wide diversity of subtypes. The process requires highly specialized pathologists as well as molecular and genetic testing that is expensive, takes time, and is not universally available. Deep neural network models (DNNs) trained on histopathology slides can reduce the time and cost to diagnosis and attenuate disparities in care based on geographical location and socioeconomic status. Here, we demonstrate the efficacy of automated image analysis for assigning sarcoma diagnoses across centers by identifying Ewing Sarcoma (ES), distinguishing rhabdomyosarcoma (RMS) vs non-rhabdomyosarcoma soft tissue sarcomas (NRSTS), as well as classifying alveolar, embryonal, and spindle cell RMS subtypes.</p>  
    category: Abstracts
    tag: CCDI Ecosystem,AI
    conference: AACR Annual Meeting 2025 

  - id: Ecosystem_04272025
    title: >-
      Developing Subtype-specific Pediatric Cancer Molecular Targets by Aggregating Diverse Genomic Data Resources to the Pediatric Cancer (PeCan) Knowledge Base Portal
    link: https://www.abstractsonline.com/pp8/#!/20273/presentation/3679
    date: April 2025
    summary: >-
      <p>Knowledge about molecular targets for pediatric cancer has accelerated exponentially in recent years thanks to the increased application of multi-omics profiling in both research and clinical settings. The efficacy of genomic-based clinical interventions may depend on whether observed genomic abnormalities are fundamental to the pathogenesis of a specific cancer subtype. At present such information is limited in pediatric cancer due to the rapid evolution of subtype discovery and classification as well as disease heterogeneity owing to the presence of many rare cancer types. To develop a comprehensive resource of molecular targets in pediatric cancer subtypes, we have integrated somatic variants in pediatric cancer samples (n=~5,500) currently hosted in PeCan Portal (http://pecan.stjude.coud) with those (n=~1,400) profiled by NCI’s Childhood Cancer Data Initiative (CCDI) molecular characterization program. To leverage the recently developed WHO CNS5 classification of CNS tumors, we reclassified 2,167 relevant samples based on molecular drivers and histology as a major update to our pediatric cancer ontology definitions, which have recently become a shared standard in the CCDI community. To determine driver genes in disease pathways relevant to specific cancer types, we analyzed the pathogenicity of SNVs and indels, CNVs, SVs and gene fusions and integrated the findings with driver genes reported in 176 publications. A total of 469 distinct driver genes were mapped to 40 pathways across the 22 major pediatric cancer types, which include 3 types of hematological malignancies (HM), 10 types of CNS tumor and 9 types of solid tumor (ST). Pathways with driver genes disrupted across the broad spectrum of cancer types include cell cycle, chromatin remodeling, PI-3K, RAS signaling and telomere maintenance. By contrast the vast majority (>90%) of the transcription factors (TF) are lineage-specific— among the 128 TF genes identified as driver genes, only 11 affect multiple lineages. These include MYC/MYCN which affect HM, ST and CNS tumors; ERG, EWSR1, FLI1 and WT1 which affect HM and ST; and KLF4, MED12, MN1, MYB and TCF4 which affect CNS and HM. These results highlight the importance of developing an infrastructure for exploring mutation prevalence in driver genes and pathways at the cancer subtype level, which will be supported in the upcoming release of the PeCan portal. This, coupled with new features for dynamic exploration of mutational signatures, global expression maps and gene-level transcription across the the cancer subtype classification tree, will greatly expand our knowledge of molecular targets and vulnerabilities in pediatric cancer, paving the way for novel therapeutic advancements.</p>  
    category: Abstracts
    tag: CCDI Ecosystem
    conference: AACR Annual Meeting 2025 

  - id: MCICOG_04272025
    title: >-
      The Molecular Characterization Initiative: Nationwide Comprehensive Clinical Profiling of Pediatric Solid Tissue Malignancies at Scale
    link: https://www.abstractsonline.com/pp8/#!/20273/presentation/7351
    date: April 2025
    summary: >-
      <p>The Molecular Characterization Initiative is an NCI-sponsored program being conducted in collaboration with the Children’s Oncology Group (COG), that seeks to enroll cancer patients from ages 0-25 with a primary diagnosis of a CNS malignancy, soft-tissue sarcoma, rare cancer or high-risk neuroblastoma onto Project Every Child. Subsequent to enrollment, the submission of a disease-involved specimen (cancer) and matched comparator normal (blood or buccal) is subjected to DNA and RNA (tumor) or DNA (normal) extraction by the Biopathology Center, followed by comprehensive clinical molecular profiling at The Institute for Genomic Medicine. To-date, over 4100 patients from 27 states in the United States, from Canada, Australia and New Zealand have been enrolled and studied since project inception in March 2022. Each patient sample set is evaluated by comparative tumor:normal exome analysis, fusion/ITD panel testing of RNA and by DNA methylation profiling, with return of results within 21 days from receipt of specimens at Nationwide Children’s Hospital. Subsequent to return of clinical results, each patient’s data are de-identified and submitted to the Childhood Cancer Database, a public repository managed by the NCI. The data in this repository are publicly available, with institutional sign-off, for the purposes of fueling future discoveries impacting pediatric cancer. The size and scope of the Molecular Characterization Initiative will be equivalent to or greater than other large-scale clinical profiling efforts conducted in Germany (INFORM) and in Australia (Zero Childhood Cancer). The current status and unique results from the MCI will be presented, along with future plans and ongoing challenges.</p>  
    category: Abstracts
    tag: CCDI-MCI
    conference: AACR Annual Meeting 2025 

  - id: Ecosystem_04212025
    title: >-
      Persistent Poverty and Pediatric Cancer Survival 
    link: https://doi.org/10.1542/peds.2024-069973
    date: April 2025
    summary: >-
      <p>Cancer is the leading cause of death by disease among US children. While previous studies have examined the impact of poverty on pediatric cancer outcomes, most relied on single time point measures, which may not capture the long-term, systemic effects of poverty. Persistent poverty, defined as having 20% or more of an area’s population below the poverty level for 30 years, represents a more comprehensive measure of sustained socioeconomic disadvantage.</p>  
    category: Secondary
    tag: CCDI Ecosystem,CCDI Data 
    journal: Pediatrics
    pmid: 40254298

  - id: Ecosystem_04022025
    title: >-
      PRDM1 Is a Key Regulator of the NKT-cell Central Memory Program and Effector Function
    link: https://pubmed.ncbi.nlm.nih.gov/39820712/
    date: April 2025
    summary: >-
      <p>Natural killer T cells (NKTs) are a promising platform for cancer immunotherapy, but few genes involved in the regulation of NKT therapeutic activity have been identified. To find regulators of NKT functional fitness, we developed a CRISPR/Cas9-based mutagenesis screen that uses a guide RNA (gRNA) library targeting 1,118 immune-related genes. Unmodified NKTs and NKTs expressing a GD2-specific chimeric antigen receptor (GD2.CAR) were transduced with the gRNA library and exposed to CD1d+ leukemia or CD1d-GD2+ neuroblastoma cells, respectively, over six challenge cycles in vitro. Quantification of gRNA abundance revealed enrichment of PRDM1-specific gRNAs in both NKTs and GD2.CAR NKTs, a result that was validated through targeted PRDM1 knockout. Transcriptional, phenotypic, and functional analyses demonstrated that CAR NKTs with PRDM1 knockout underwent central memory-like differentiation and resisted exhaustion. However, these cells downregulated the cytotoxic mediator granzyme B and showed reduced in vitro cytotoxicity and only moderate in vivo antitumor activity in a xenogeneic neuroblastoma model. In contrast, short hairpin RNA-mediated PRDM1 knockdown preserved effector function while promoting central memory differentiation, resulting in GD2.CAR NKTs with potent in vivo antitumor activity. Thus, we have identified PRDM1 as a regulator of NKT memory differentiation and effector function that can be exploited to improve the efficacy of NKT-based cancer immunotherapies.</p>  
    category: Secondary
    tag: CCDI Ecosystem,CCDI Data
    journal: Cancer Immunology Research
    pmid: 39820712

  - id: NCCR_01122025
    title: >-
      Making the case for an International Childhood Cancer Data Partnership
    link: https://pubmed.ncbi.nlm.nih.gov/39799506
    date: January 2025
    summary: >-
      <p>Childhood cancers are a heterogeneous group of rare diseases, accounting for less than 2% of all cancers diagnosed worldwide. Most countries, therefore, do not have enough cases to provide robust information on epidemiology, treatment, and late effects, especially for rarer types of cancer. Thus, only through a concerted effort to share data internationally will we be able to answer research questions that could not otherwise be answered. With this goal in mind, the U.S. National Cancer Institute and the French National Cancer Institute co-sponsored the Paris Conference for an International Childhood Cancer Data Partnership in November 2023. This meeting convened more than 200 participants from 17 countries to address complex challenges in pediatric cancer research and data sharing. This Commentary delves into some key topics discussed during the Paris Conference and describes pilots that will help move this international effort forward. Main topics presented include: 1) the wide variation in interpreting the European Union's General Data Protection Regulation among Member States; 2) obstacles with transferring personal health data outside of the European Union; 3) standardization and harmonization, including common data models; and 4) novel approaches to data sharing such as federated querying and federated learning. We finally provide a brief description of three ongoing pilot projects. The International Childhood Cancer Data Partnership is the first step in developing a process to better support pediatric cancer research internationally through combining data from multiple countries.</p>
    category: Secondary
    tag: CCDI-NCCR
    journal: >-
      JNCI: Journal of the National Cancer Institute
    pmid: 39799506

  - id: Ecosystem_01022025
    title: >-
      RanBALL: An Ensemble Random Projection Model for Identifying Subtypes of B-Cell Acute Lymphoblastic Leukemia
    link: https://doi.org/10.1101/2024.09.24.614777
    date: January 2025
    summary: >-
      <p>As the most common pediatric malignancy, B-cell acute lymphoblastic leukemia (B-ALL) has multiple distinct subtypes characterized by recurrent and sporadic somatic and germline genetic alterations. Identifying B-ALL subtypes can facilitate risk stratification and enable tailored therapeutic design. Existing methods for B-ALL subtyping primarily depend on immunophenotyping, cytogenetic tests and genomic profiling, which would be costly, complicated, and laborious. To overcome these challenges, we present RanBALL (an ensemble Random projection-based model for identifying B-ALL subtypes), an accurate and cost-effective model for B-ALL subtype identification. By leveraging random projection (RP) and ensemble learning, RanBALL can preserve patient-to-patient distances after dimension reduction and yield robustly accurate classification performance for B-ALL subtyping. Benchmarking results based on > 1700 B-ALL patients demonstrated that RanBALL achieved remarkable performance (accuracy: 0.93, F1-score: 0.93, and Matthews correlation coefficient: 0.93), significantly outperforming state-of-the-art methods like ALLSorts in terms of all performance metrics. In addition, RanBALL performs better than tSNE in terms of visualizing B-ALL subtype information. We believe RanBALL will facilitate the discovery of B-ALL subtype-specific marker genes and therapeutic targets to have consequential positive impacts on downstream risk stratification and tailored treatment design. To extend its applicability and impacts, a Python-based RanBALL package is available at https://github.com/wan-mlab/RanBALL.</p>
    category: Secondary
    tag: CCDI Ecosystem,AI
    type: Preprint

  - id: Ecosystem_01012025
