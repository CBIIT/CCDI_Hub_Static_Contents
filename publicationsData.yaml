  - id: NCCR_06032025_3
    title: >-
      Best Practices for Managing Data Sets from the National Childhood Cancer Registry (NCCR) Data Platform
    link: https://www.naaccr2025hartford.com/_files/ugd/eb0601_fe20db5cbaf94d45a3156a98845b36be.pdf
    date: June 2025
    summary: >-
      <p>The NCCR Data Platform consolidates public health surveillance data from 22 NCCR participating cancer registries into a central location linked to real world data sources. This valuable resource allows researchers approved access to pooled data on longitudinal clinical, treatment, claims, demographic and outcomes data for rare childhood cancers in the U.S. Currently the NCCR Data Platform provides information on 1.4+ million cases from 1995 to 2021 stemming from seven population based or convenience sample sources. Data can be interactively explored within the Data Platform and manipulated to create customized cohorts. These cohorts can be requested for downloading through the NCCR Data Platform data request process.</p>  
