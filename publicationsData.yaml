  - id: MCICOG_06012025_2
    title: >-
      CCDI-COG Molecular Characterization Initiative: The Expanding Data on Childhood Cancer 
    link: https://meetings.asco.org/2025-asco-annual-meeting/16395?presentation=246435#246435
    date: June 2025
    summary: >-
      <p>The NCI-Children’s Oncology Group (COG) Molecular Characterization Initiative (MCI) provides rapid, clinical sequencing of newly diagnosed central nervous system (CNS) tumors, rare tumors, soft tissue sarcomas (STS), or neuroblastoma (NB) to guide diagnosis and treatment for children with these rare cancers. Results: Between 3/31/22 and 11/1/24, the MCI resulted sequencing tests for 3,740 patients, including >2,500 patients with CNS tumors, ~700 patients with STS, 350 with rare tumors and 150 with NB.  89% of the >10,000 individual tests resulted within 2 weeks from receipt of nucleic acids for sequencing. Germline single nucleotide (SNV) or copy number (CNV) variants were identified in 528 (14.1%) patients, ranging from 10.4% (NB) to 25.1% (rare tumors). Common germline alterations included SNVs in TP53 (n=52,1.4%), CHEK2 (n=50,1.3%), DICER1 (n=35,0.93%), NF1 (n=29,0.78%), and ATM (n=24,0.64%). Somatic SNVs or CNVs were identified in 85% of samples overall. SNVs most commonly involved TP53 (N=309,8.3%), BRAF (n=222,6.9%) or CTNNB1 (n=166,4.4%). Targeted RNA sequencing identified gene fusions in 30% of samples (23% rare, 27% CNS, 40% STS). Methylation array resulted in positive subclassification of CNS tumors in 90% of patients, including subclassifying 522 patients with medulloblastoma. Follow up data has been returned for 971 patients (NCI-CCDI Hub), with 749 evaluating the utility of MCI testing including: resulted in enrollment on a clinical trial (yes, n=86,11.5%), resulted in patient being treated with a targeted therapy (yes, n=80,10.7%), or resulted in refining the pathologic diagnosis (yes, n=223,29.5%).</p>  
    category: Abstract
    tag: CCDI-MCI-COG
    conference: American Society of Clinical Ontology (ASCO) 2025

  - id: MCICOG_06012025_1
    title: >-
      Integrated Molecular Characterization of Pediatric Soft Tissue Sarcomas: A Report from the COG and CCDI Molecular Characterization Initiative
    link: https://meetings.asco.org/2025-asco-annual-meeting/16393?presentation=247352#247352
    date: June 2025
    summary: >-
      <p> The Molecular Characterization Initiative (MCI), a partnership between the Children’s Oncology Group (COG) and the NCI’s Childhood Cancer Data Initiative (CCDI), provides standardized genomic profiling of tumors and germline for subjects with newly diagnosed pediatric soft tissue sarcomas (STS). Here, we report on STS patients <25 enrolled in MCI from July 2022 to July 2023.</p>  
    category: Abstract
    tag: CCDI-MCI-COG
    conference: American Society of Clinical Ontology (ASCO) 2025

